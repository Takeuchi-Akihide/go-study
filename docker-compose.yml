services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://dev:password@db:5432/app_db?sslmode=disable"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: go_backend_db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
